name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间 0:00, 12:00 自动触发更新（北京时间 8:00、20:00）
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      # ── 新增：GitHub Pages 发布（不再走 Cloudflare Worker）──
      # 注意：仓库需先改公开，Settings → Pages → Source 选 GitHub Actions
      # 上传 output 目录本身，发布后订阅地址为：
      #   https://你的用户名.github.io/仓库名/v2ray.txt
      # （不是 /output/v2ray.txt，因为 output 就是站点根目录）
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
